name: Go test windows

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
# If not running on cron schedule, remove schedule: key

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  SENZING_LOG_LEVEL: TRACE
  SENZING_TOOLS_DATABASE_URL: "sqlite3://na:na@nowhere/C:\\Temp\\sqlite\\G2C.db"

permissions: {}

jobs:
  sdk-versions:
    # Emits a static version matrix; needs no token.
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      senzingsdk-versions: ${{ steps.cfg.outputs.senzingsdk-versions }}
    steps:
      - id: cfg
        uses: senzing-factory/build-resources/sdk-versions@v4

  go-test-windows:
    name: "Go test with Senzing: ${{ matrix.senzingsdk-version }}; OS: windows-latest; Go: ${{ matrix.go }}"
    needs: sdk-versions
    permissions:
      contents: read
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27"]
        senzingsdk-version: ${{ fromJSON(needs.sdk-versions.outputs.senzingsdk-versions) }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup go ${{ matrix.go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Set up gotestfmt
        uses: gotesttools/gotestfmt-action@eba2ac97f623e866e7b1b117c99f18b43cd36d18 # v2.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint staging bucket token
        if: matrix.senzingsdk-version != 'production-v4'
        id: staging-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SENZINGSDK_STAGING_CLIENT_ID }}
          private-key: ${{ secrets.SENZINGSDK_STAGING_APP_KEY }}
          owner: senzing-factory # zizmor: ignore[github-app]
          repositories: scoop-senzingsdk-staging
          permission-contents: read

      - name: Install Senzing SDK
        uses: senzing-factory/github-action-install-senzing-sdk@v5
        with:
          senzingsdk-version: ${{ matrix.senzingsdk-version }}
          senzingsdk-token: ${{ steps.staging-token.outputs.token || github.token }}

      - name: Set environment variables
        run: |
          Add-Content "$env:GITHUB_PATH" "$Env:USERPROFILE\Senzing\er\lib"

      - name: Copy /etc files
        run: |
          copy testdata/senzing-license/g2.lic "$Env:USERPROFILE\Senzing\er\etc\g2.lic"

      - name: Copy test database files
        run: |
          mkdir "C:\Temp\sqlite"
          copy testdata/sqlite/G2C.db "C:\Temp\sqlite\G2C.db"

      - name: Run go test
        env:
          SENZING_SDK_VERSION: ${{ matrix.senzingsdk-version }}
        run: |
          $Env:SENZING_PATH = "$Env:USERPROFILE\Senzing"
          $Env:CGO_CFLAGS = "-g -I$Env:SENZING_PATH\er\sdk\c"
          $Env:CGO_LDFLAGS = "-L$Env:SENZING_PATH\er\lib -lSz"
          go test -json -v -p 1 -coverprofile=cover -covermode=atomic -coverpkg=./... ./... 2>&1 | tee "C:\Temp\gotest-$env:SENZING_SDK_VERSION.log" | gotestfmt
          cp cover "cover-$env:SENZING_SDK_VERSION.out"

      - name: Store coverage file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "cover-${{ matrix.senzingsdk-version }}.out"
          path: "cover-${{ matrix.senzingsdk-version }}.out"

      - name: Upload test log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "test-log-${{ matrix.senzingsdk-version }}"
          path: "C:\\Temp\\gotest-${{ matrix.senzingsdk-version }}.log"
          if-no-files-found: error

      - name: Notify Slack on failure
        # Schedule only. Unlike go-test-linux this workflow has no `push` trigger,
        # so the default-branch clause would add exactly one case: a
        # workflow_dispatch run from main -- which a human just started and is
        # watching, and does not need a Slack message.
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: senzing-factory/build-resources/slack-failure-notification@v4
        with:
          job-status: ${{ job.status }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          additional-info: "SDK: ${{ matrix.senzingsdk-version }} | Go: ${{ matrix.go }}"

  coverage:
    name: Coverage
    needs: go-test-windows
    permissions:
      contents: read
    uses: senzing-factory/build-resources/.github/workflows/go-coverage.yaml@v4
    with:
      coverage-config: ./.github/coverage/testcoverage.yaml
      profile: "cover-production-v4.out,cover-staging-v4.out"
